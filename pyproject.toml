[project]
name = "plaindiff"
version = "1.0.0"
description = "A line-level diff whose edit script can be redrawn on paper."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon Niehaus" }]

[project.scripts]
plaindiff = "plaindiff.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
